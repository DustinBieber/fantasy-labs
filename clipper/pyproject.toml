[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper"
version = "0.1.0"
description = "Fantasy Labs clipping service: find long-form creators, cut subtitled shorts, post to their socials."
requires-python = ">=3.10"
dependencies = [
  "yt-dlp[default]>=2026.10.21",
  "deno>=2.4",              # JS runtime yt-dlp needs for YouTube
  "anthropic>=2.0",
  "httpx>=0.27",
  "pyyaml>=6",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "cryptography>=42",
]

[project.optional-dependencies]
# Local transcription fallback for videos without YouTube captions.
whisper = ["faster-whisper>=1.0"]       # CPU, works in Docker and natively
mlx = ["mlx-whisper>=0.4"]              # Apple Silicon native, much faster
dev = ["pytest>=8"]

[project.scripts]
clipper = "clipper.cli:main"

[tool.setuptools.packages.find]
include = ["clipper*"]

[tool.setuptools.package-data]
clipper = ["web/templates/*.html", "web/static/*", "config.example.yaml", "env.example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
