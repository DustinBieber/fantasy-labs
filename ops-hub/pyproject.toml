[project]
name = "opshub"
version = "0.1.0"
description = "Order, inventory, freight and 3PL billing hub that pulls from Shopify, Extensiv, Lightspeed, RQ and Google Workspace"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
opshub = "opshub.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["opshub*"]

[tool.setuptools.package-data]
opshub = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
